# Next.js supplies the application bundler; Vite+ only runs tasks and checks.
# Permit the image optimizer's native dependency to install its binary.
allowBuilds:
  sharp: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@next/env@16.4.2'
  - '@next/swc-darwin-arm64@16.4.2'
  - '@next/swc-darwin-x64@16.4.2'
  - '@next/swc-linux-arm64-gnu@16.4.2'
  - '@next/swc-linux-arm64-musl@16.4.2'
  - '@next/swc-linux-x64-gnu@16.4.2'
  - '@next/swc-linux-x64-musl@16.4.2'
  - '@next/swc-win32-arm64-msvc@16.4.2'
  - '@next/swc-win32-x64-msvc@16.4.2'
  - '@vitest/browser-preview@5.0.5'
  - '@vitest/browser@5.0.5'
  - '@vitest/mocker@5.0.5'
  - '@vitest/pretty-format@5.0.5'
  - '@vitest/snapshot@5.0.5'
  - '@vitest/spy@5.0.5'
  - '@vitest/ui@5.0.5'
  - '@vitest/utils@5.0.5'
  - '@voidzero-dev/vite-plus-core@1.3.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.3.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.3.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.3.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.3.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.3.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.3.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.3.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.3.0'
  - next@16.4.2
  - vite-plus@1.3.0
  - vitest@5.0.5
