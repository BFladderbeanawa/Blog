# pnpm root settings. Astro brings its own Vite, so the Vite+ core alias is
# deliberately not overridden here — see vite.config.ts.
#
# esbuild and sharp ship postinstall scripts that place their native binaries.
# Everything else is disallowed by default; pnpm adds unknown build scripts here
# with a placeholder when an install hits one.
allowBuilds:
  esbuild: true
  sharp: true
